metadata:
  name: web4
  full_name: "Web4: Trust-Native Distributed Intelligence Architecture"
  description: "Open substrate for verifiable presence, scoped authority, witnessed action, machine-readable law, contextual trust and federation"
  type: specification  # specification | library | tool | research | product
  domain:
    - trust
    - identity
    - distributed-systems
    - ai-governance
    - federation
  license: AGPL-3.0
  last_updated: "2026-10-01"

status:
