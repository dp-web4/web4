  production_ready: false
  active_development: true
  open_assurance_ceiling: A1

core_concepts:
  LCT:
    name: "Linked Context Token"
    purpose: "Persistent, non-transferable, witnessable entity presence"
    spec: "web4-standard/core-spec/LCT-linked-context-token.md"
  T3:
    name: "Trust Tensor"
    purpose: "Contextual trust evidence rooted in Talent, Training and Temperament with extensible subdimensions"
    dimensions: [talent, training, temperament]
    spec: "web4-standard/core-spec/t3-v3-tensors.md"
  V3:
    name: "Value Tensor"
    purpose: "Contextual value evidence rooted in Valuation, Veracity and Validity with extensible subdimensions"
    dimensions: [valuation, veracity, validity]
    spec: "web4-standard/core-spec/t3-v3-tensors.md"
  ATP:
    name: "Allocation Transfer Packet"
    purpose: "Resource/energy accounting"
    spec: "web4-standard/core-spec/atp-adp-cycle.md"
  MRH:
    name: "Markov Relevancy Horizon"
    purpose: "Context boundaries for entities"
    spec: "web4-standard/core-spec/mrh-tensors.md"
  R6:
    name: "Request Lifecycle"
    purpose: "Action framework"
    stages: [rules, role, request, reference, resource, result]
    spec: "web4-standard/core-spec/r6-framework.md"

